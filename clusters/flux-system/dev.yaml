# Single ImageUpdateAutomation for dev – updates tags in overlays/dev/kustomization.yaml
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: dev
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: flux-bot
        email: flux@local
      messageTemplate: |
        Update dev image(s) to {{range .Updated.Images}}{{println .}}{{end}}
    push:
      branch: main
  update:
    path: ./overlays/dev
    strategy: Setters
# Kustomization for the dev environment
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: botmother-dev
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: botmother-web
      namespace: botmother-dev
    - apiVersion: apps/v1
      kind: Deployment
      name: webhook
      namespace: botmother-dev
  timeout: 5m0s
