# Dev environment ImagePolicy resources – filter images tagged with *-dev suffix
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: backend-dev
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: backend
  filterTags:
    pattern: "^(?P<version>.*)-dev$"
    extract: "$version"
  policy:
    semver:
      range: ">=0.0.1"
