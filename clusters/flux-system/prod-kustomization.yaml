apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: botmother-prod
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./overlays/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: botmother-web
      namespace: botmother
    - apiVersion: apps/v1
      kind: Deployment
      name: webhook
      namespace: botmother
  timeout: 5m0s
