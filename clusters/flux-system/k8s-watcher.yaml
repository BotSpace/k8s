apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: k8s-watcher
  namespace: flux-system
spec:
  image: registry.jscorp.uz/k8s-watcher
  interval: 1m
  secretRef:
    name: registry-secret
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: k8s-watcher
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: k8s-watcher
  filterTags:
    pattern: '^v(?P<version>\d+\.\d+\.\d+)$'
    extract: "$version"
  policy:
    semver:
      range: ">=1.0.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: k8s-watcher
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: flux-bot
        email: flux@local
      messageTemplate: |
        Update k8s-watcher image to {{range .Updated.Images}}{{println .}}{{end}}
    push:
      branch: main
  update:
    path: ./base
    strategy: Setters
