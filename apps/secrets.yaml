# WARNING: This is a template file with placeholder values.
# Replace all 'changeme' values with actual secure secrets before deployment.
# Consider using external secret management solutions like:
# - Sealed Secrets
# - External Secrets Operator
# - SOPS with Flux
apiVersion: v1
kind: Secret
metadata:
  name: botmother-secrets
  namespace: botmother
type: Opaque
stringData:
  # Database
  POSTGRES_PASSWORD: "changeme"
  DB_PASSWORD: "changeme"

  # Django
  DJANGO_SECRET_KEY: "changeme"

  # External services
  MONGO_URL: "mongodb://bot:password@mongo:27017"
  BOT_TOKEN: "changeme"
  TEST_BOT_TOKEN: "changeme"

  # Click payment
  CLICK_SERVICE_ID: "none"
  CLICK_MERCHANT_ID: "none"
  CLICK_SECRET_KEY: "none"

  # Docker Registry (for pulling images)
  DOCKER_USERNAME: "changeme"
  DOCKER_PASSWORD: "changeme"
  DOCKER_REGISTRY: "registry.example.com"
