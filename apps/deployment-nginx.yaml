apiVersion: apps/v1
kind: Deployment
metadata:
  name: botmother-nginx
  namespace: botmother
  labels:
    app: botmother
    component: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: botmother
      component: nginx
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: botmother
        component: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 2000m
              memory: 1024Mi
          volumeMounts:
            - name: media
              mountPath: /usr/share/nginx/html/resources/media
              readOnly: true
            - name: static
              mountPath: /usr/share/nginx/html/resources/staticfiles
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /var/tmp
            - name: nginx-config-volume
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          livenessProbe:
            httpGet:
              path: /health/
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: nginx-config-volume
          configMap:
            name: nginx-config
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: media
          persistentVolumeClaim:
            claimName: botmother-media
        - name: static
          persistentVolumeClaim:
            claimName: botmother-static
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: botmother-nginx
  namespace: botmother
  labels:
    app: botmother
    component: nginx
spec:
  type: NodePort
  selector:
    app: botmother
    component: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30082
