apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: botmother

resources:
  - namespace.yaml
  - secrets.yaml
  - configmap.yaml
  - rbac.yaml
  - postgres.yaml
  - redis.yaml
  - web.yaml
  - nginx-config.yaml
  - nginx.yaml
  - ingress.yaml

# Image configuration - updated automatically by Flux Image Automation
# The marker comment below is used by Flux to identify where to update the tag
images:
  - name: registry.jscorp.uz/botmother
    newTag: "latest" # {"$imagepolicy": "flux-system:botmother:tag"}

# Common labels
labels:
  - pairs:
      app.kubernetes.io/name: botmother
      app.kubernetes.io/managed-by: flux
