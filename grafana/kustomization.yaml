# Grafana dashboard provisioning (kube-prometheus-stack sidecar).
#
# The Grafana sidecar (kiwigrid/k8s-sidecar) WATCHes every namespace for
# ConfigMaps labelled `grafana_dashboard: "1"` and auto-imports the JSON
# inside. configMapGenerator builds that ConfigMap straight from the JSON
# file so the dashboard stays the single source of truth (no duplication).
#
# Apply:   kubectl apply -k k8s/grafana
# Remove:  kubectl delete -k k8s/grafana
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

generatorOptions:
  # Keep a stable ConfigMap name (no content-hash suffix) so re-applies update
  # the same object the sidecar already tracks.
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"

configMapGenerator:
  # Yagona birlashtirilgan dashboard — biznes + tashriflar + debug + AI +
  # servislar (webhook/websocket). Eski botspace-business/botspace-visits
  # shu yerga ko'chdi; ularning ConfigMap'lari clusterdan o'chiriladi.
  - name: botspace-overview-dashboard
    files:
      - botspace-overview.json
  # Bot engine metrikalari (bot_* — xabar, update, node, xato, HTTP, CMS).
  # Manba: PodMonitor `botmother-engine` (helm/infra/monitoring.yaml).
  - name: botspace-engine-dashboard
    files:
      - botspace-engine.json
