apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    release: monitoring
  name: agent
  namespace: monitoring
spec:
  endpoints:
    - interval: 15s
      path: /metrics
      port: http
  namespaceSelector:
    matchNames:
      - botmother
  selector:
    matchLabels:
      app.kubernetes.io/instance: agent
