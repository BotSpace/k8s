# ─────────────────────────────────────────────────────────────────────────────
# Prometheus ServiceMonitors for the Botmother stack.
#
# Helm app services carry `app.kubernetes.io/instance: <app-name>`.
# The standalone engine-pool Service uses `app: botmother-engine-pool`.
# ServiceMonitors select these services and scrape their named `http` port.
#
# The kube-prometheus-stack Prometheus selects ServiceMonitors via the
# label `release: monitoring` — all entries here have that label.
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    release: monitoring
  name: agent
  namespace: monitoring
spec:
  endpoints:
    - interval: 15s
      path: /metrics
      port: http
  namespaceSelector:
    matchNames:
      - botmother
  selector:
    matchLabels:
      app.kubernetes.io/instance: agent
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    release: monitoring
  name: web
  namespace: monitoring
spec:
  endpoints:
    # django_prometheus registers the view as `metrics` (NO trailing slash);
    # `/metrics/` 404s and the target goes DOWN. Must be `/metrics`.
    - interval: 30s
      path: /metrics
      port: http
  namespaceSelector:
    matchNames:
      - botmother
  selector:
    matchLabels:
      app.kubernetes.io/instance: web
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    release: monitoring
  name: auth
  namespace: monitoring
spec:
  endpoints:
    - interval: 30s
      path: /metrics
      port: http
  namespaceSelector:
    matchNames:
      - botmother
  selector:
    matchLabels:
      app.kubernetes.io/instance: auth
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    release: monitoring
  name: webhook
  namespace: monitoring
spec:
  endpoints:
    # webhook uses a non-default path: /api/webhook-metrics/
    - interval: 30s
      path: /api/webhook-metrics/
      port: http
  namespaceSelector:
    matchNames:
      - botmother
  selector:
    matchLabels:
      app.kubernetes.io/instance: webhook
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    release: monitoring
  name: websocket
  namespace: monitoring
spec:
  endpoints:
    # websocket uses /ws/metrics
    - interval: 30s
      path: /ws/metrics
      port: http
  namespaceSelector:
    matchNames:
      - botmother
  selector:
    matchLabels:
      app.kubernetes.io/instance: websocket
---
# One target per worker endpoint, not the load-balanced Service address.
# Child-process metrics already carry the canonical project_id label.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    release: monitoring
  name: engine-pool
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - botmother
  selector:
    matchLabels:
      app: botmother-engine-pool
  endpoints:
    - interval: 15s
      scrapeTimeout: 10s
      path: /metrics
      port: http
      relabelings:
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
---
# Bot engine pods (release-*/debug-*) expose the engine's Prometheus bot_*
# counters on the named "metrics" port (9090). They are created per-bot at
# runtime (not by the botmother-app Helm chart), and their Service only
# publishes :8000 — so we scrape the pods directly with a PodMonitor, selecting
# the engine's own pod label `app: botmother-engine`.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    release: monitoring
  name: botmother-engine
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - botmother
  selector:
    matchLabels:
      app: botmother-engine
  podMetricsEndpoints:
    - interval: 30s
      path: /metrics
      port: metrics
      relabelings:
        # Carry the pod's project_id label onto the scraped bot_* series so the
        # dashboard can group / filter by project.
        - sourceLabels: [__meta_kubernetes_pod_label_project_id]
          targetLabel: project_id
