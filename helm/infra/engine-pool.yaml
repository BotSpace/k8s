apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-pool
  namespace: botmother
  labels:
    app: botmother-engine-pool
    engine-name: engine-pool
    app.kubernetes.io/part-of: botmother
spec:
  replicas: 3
  selector:
    matchLabels:
      app: botmother-engine-pool
  template:
    metadata:
      labels:
        app: botmother-engine-pool
        engine-name: engine-pool
    spec:
      imagePullSecrets:
        - name: iprogrammer-registry
      containers:
        - name: engine
          image: registry.iprogrammer.uz/botspace/golang-engine:52f26c7
          command: ["/app/supervisor"]
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_ENABLED
              value: "true"
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-golang-app
                  key: APP_ENGINE_REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: backend-golang-app
                  key: APP_ENGINE_REDIS_PORT
            - name: REDIS_ADDR
              value: "$(REDIS_HOST):$(REDIS_PORT)"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-golang-app
                  key: APP_ENGINE_REDIS_PASSWORD
            - name: API_URL
              value: "http://backend-golang:8080"
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend-golang-app
                  key: APP_INTERNAL_TOKEN
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend-golang-app
                  key: APP_INTERNAL_TOKEN
            - name: MONGO_ADDR
              valueFrom:
                secretKeyRef:
                  name: backend-golang-app
                  key: APP_ENGINE_MONGO_ADDR
            - name: MONGO_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-golang-app
                  key: APP_ENGINE_MONGO_DB_NAME
            - name: RUNTIME_IDLE_TIMEOUT
              value: "30m"
            - name: LOG_LEVEL
              value: "info"
            - name: BOT_RUNTIME_PATH
              value: "/app/bot"
            - name: POOL_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: engine-pool
  namespace: botmother
  labels:
    app: botmother-engine-pool
    engine-name: engine-pool
    app.kubernetes.io/part-of: botmother
spec:
  selector:
    app: botmother-engine-pool
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
