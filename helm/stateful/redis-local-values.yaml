fullnameOverride: redis

image:
  repository: redis
  tag: "7"
  pullPolicy: IfNotPresent

workloadType: DaemonSet
replicaCount: 1

service:
  enabled: true
  type: ClusterIP
  port: 6379

storage:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

probes:
  readiness:
    enabled: false
  liveness:
    enabled: false
