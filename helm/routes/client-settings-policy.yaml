apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: botmother-agent-client-body
  namespace: botmother
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: botmother-agent
  body:
    maxSize: 200m
