apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: botmother-api
  namespace: botmother
spec:
  parentRefs:
    - name: main-gateway
      namespace: default
  hostnames:
    - api.botmother.uz
    - api.botspace.uz
    - botlarnionasi.jscorp.uz
  rules:
    # MCP OAuth authorization server — migrated off the Django `web` catch-all
    # to the Go backend (oauth module), which authenticates the UUID user_id
    # these tokens carry (the Django SimpleJWT path 500'd on it). Bare,
    # un-prefixed paths served at root by backend-golang (no /api/v1 rewrite).
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/oauth-authorization-server
        - path:
            type: PathPrefix
            value: /auth/oauth
      backendRefs:
        - name: backend-golang
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/auth
      backendRefs:
        - name: auth
          port: 8080
    # Module/plugin system (catalog + github-webhook + CI redeploy hooks).
    # Ported to the Go backend (plugin module, served under /api/v1). External
    # hooks (GitHub, CI) POST the literal /api/v1 path and can't use the
    # frontend's /api/v2 prefix, so route them straight to backend-golang
    # instead of falling through to the old Django catch-all.
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/modules
      backendRefs:
        - name: backend-golang
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api/bot-webhook
        - path:
            type: PathPrefix
            value: /api/webhook-metrics
        - path:
            type: PathPrefix
            value: /api/bot-router
        - path:
            type: PathPrefix
            value: /api/hook
      backendRefs:
        - name: webhook
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 8000
