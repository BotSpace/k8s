apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: botmother-agent
  namespace: botmother
spec:
  parentRefs:
    - name: main-gateway
      namespace: default
  hostnames:
    - api.botmother.uz
    - api.botspace.uz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/agent/v4
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: agent-v4
          port: 8094
    - matches:
        - path:
            type: PathPrefix
            value: /api/agent/v3
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: agent
          port: 8100
    - matches:
        - path:
            type: PathPrefix
            value: /api/agent
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: agent
          port: 8100
