apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: botmother-mcp
  namespace: botmother
spec:
  parentRefs:
    - name: main-gateway
      namespace: default
  hostnames:
    - botspace.uz
  rules:
    # MCP server agentv3 ichida /mcp path'da xizmat qiladi (Streamable HTTP),
    # shu sabab URLRewrite KERAK EMAS — prefix o'z holicha forward qilinadi.
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: agent
          port: 8100
