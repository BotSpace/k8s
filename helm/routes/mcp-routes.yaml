apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: botmother-mcp
  namespace: botmother
spec:
  parentRefs:
    - name: main-gateway
      namespace: default
  hostnames:
    - botspace.uz
  rules:
    # MCP server agent ichida /mcp path'da xizmat qiladi (Streamable HTTP),
    # shu sabab URLRewrite KERAK EMAS — prefix o'z holicha forward qilinadi.
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: agent
          port: 8100
    # RFC 9728 OAuth discovery — MCP klientlar (Claude Code) 401'dan keyin shu
    # metadata'ni o'qiydi. Agent o'zi serve qiladi.
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/oauth-protected-resource
      backendRefs:
        - name: agent
          port: 8100
