apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: botmother-websocket
  namespace: botmother
spec:
  parentRefs:
    - name: main-gateway
      namespace: default
  hostnames:
    - api.botmother.uz
    - api.botspace.uz
    - botlarnionasi.jscorp.uz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ws
      backendRefs:
        - name: websocket
          port: 8080
