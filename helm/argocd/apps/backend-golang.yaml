apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-golang
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: botmother
spec:
  project: botmother
  sources:
    - repoURL: https://github.com/BotSpace/helm-charts.git
      targetRevision: main
      path: charts/botmother-app
      helm:
        valueFiles:
          - $values/helm/values.yaml
          - $values/helm/values-api.yaml
    - repoURL: https://github.com/BotSpace/backend-golang.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: botmother
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
