apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: collab-worker
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: botmother
spec:
  project: botmother
  sources:
    - repoURL: https://github.com/BotSpace/helm-charts.git
      targetRevision: main
      path: charts/botmother-app
      helm:
        valueFiles:
          - $values/helm/values.yaml
        # web bilan bir xil image/env (backend repo values), faqat command boshqa:
        # real-time collab op'larini Redis'dan o'qib project.flow'ga saqlaydi.
        values: |
          fullnameOverride: "collab-worker"
          command: ["sh", "/code/resources/scripts/collab-worker.sh"]
          podLabels:
            app: botmother
            component: collab-worker
          strategy:
            type: Recreate
          service:
            enabled: false
          probes:
            startup:
              enabled: false
            readiness:
              enabled: false
            liveness:
              enabled: false
          podDisruptionBudget:
            enabled: false
          prometheus:
            scrape: false
          # PVC obyektlarini web app boshqaradi — bu yerda qayta yaratmaymiz.
          persistentVolumeClaims: []
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
    - repoURL: https://github.com/BotSpace/backend.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: botmother
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
