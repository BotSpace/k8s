apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: celery-beat
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: botmother
spec:
  project: botmother
  sources:
    - repoURL: https://github.com/BotSpace/helm-charts.git
      targetRevision: main
      path: charts/botmother-app
      helm:
        valueFiles:
          - $values/helm/values.yaml
        # web bilan bir xil image/env (backend repo values), faqat command boshqa.
        # Beat HAR DOIM 1 dona bo'lishi shart — strategy Recreate (ikki beat
        # parallel ishlasa schedule ikki marta yuboriladi).
        values: |
          fullnameOverride: "celery-beat"
          command: ["bash", "/code/resources/scripts/celery-beat.sh"]
          replicaCount: 1
          podLabels:
            app: botmother
            component: celery-beat
          strategy:
            type: Recreate
          service:
            enabled: false
          probes:
            startup:
              enabled: false
            readiness:
              enabled: false
            liveness:
              enabled: false
          podDisruptionBudget:
            enabled: false
          prometheus:
            scrape: false
          # PVC obyektlarini web app boshqaradi — bu yerda qayta yaratmaymiz.
          persistentVolumeClaims: []
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
    - repoURL: https://github.com/BotSpace/backend.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: botmother
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
