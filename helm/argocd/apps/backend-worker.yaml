apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-worker
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: botmother
spec:
  project: botmother
  sources:
    - repoURL: https://github.com/BotSpace/helm-charts.git
      targetRevision: main
      path: charts/botmother-app
      helm:
        valueFiles:
          - $values/helm/values.yaml
        # Worker runs from the backend-golang image. The default image
        # entrypoint starts the API; this deployment overrides it to run the
        # worker binary built into the same image.
        values: |
          fullnameOverride: "backend-worker"
          command: ["/app/worker"]
          podLabels:
            app: botmother
            component: backend-worker
          strategy:
            type: Recreate
          service:
            enabled: false
          probes:
            startup:
              enabled: false
            readiness:
              enabled: false
            liveness:
              enabled: false
          podDisruptionBudget:
            enabled: false
          prometheus:
            scrape: false
          persistentVolumeClaims: []
          serviceAccount:
            create: true
            name: backend-worker
            rules:
              - apiGroups: ["apps"]
                resources: ["deployments"]
                verbs: ["get", "list", "delete"]
              - apiGroups: [""]
                resources: ["secrets", "configmaps", "services"]
                verbs: ["get", "list", "delete"]
              - apiGroups: [""]
                resources: ["pods"]
                verbs: ["get", "list"]
          envFrom:
            - secretRef:
                name: botmother-secret
            - secretRef:
                name: backend-golang-db
            - secretRef:
                name: mongo-secret
            - secretRef:
                name: redis-secret
          env:
            - name: K8S_NAMESPACE
              value: botmother
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
    - repoURL: https://github.com/BotSpace/backend-golang.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: botmother
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
