apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-watcher-golang
  namespace: botmother
  labels:
    app: botmother
    component: k8s-watcher-golang
spec:
  replicas: 1
  selector:
    matchLabels:
      app: botmother
      component: k8s-watcher-golang
  template:
    metadata:
      labels:
        app: botmother
        component: k8s-watcher-golang
    spec:
      serviceAccountName: backend-sa
      restartPolicy: Always
      containers:
        - name: k8s-watcher
          image: registry.jscorp.uz/k8s-watcher:v1.0.11 # {"$imagepolicy": "flux-system:k8s-watcher"}
          imagePullPolicy: Always
          command:
            - ./k8s-watcher
          args:
            - "--namespace=botmother"
            - "--label-selector=app=botmother-engine"
            - "--timeout=300"
            - "--verbose"
          env:
            # redis
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_ADDR
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            # Database
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: DB_PASSWORD
            # Kubernetes
            - name: K8S_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: k8s
                  key: K8S_NAMESPACE
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f k8s-watcher
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f k8s-watcher
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f k8s-watcher
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
      imagePullSecrets:
        - name: botmother-registry
