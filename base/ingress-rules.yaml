metadata:
  name: botmother-websocket
  namespace: botmother
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/websocket-services: "websocket"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/connection-proxy-header: "upgrade"
spec:
  ingressClassName: nginx
  rules:
    - host: botlarnionasi.jscorp.uz
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: websocket
                port:
                  number: 8080
    - host: api.botmother.uz
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: websocket
                port:
                  number: 8080
    - host: api.botspace.uz
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: websocket
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: botmother-sse
  namespace: botmother
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-cache: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Connection "";
      proxy_set_header X-Accel-Buffering no;
      chunked_transfer_encoding off;
spec:
  ingressClassName: nginx
  rules:
    - host: botlarnionasi.jscorp.uz
      http:
        paths:
          - path: /sse
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8000
    - host: api.botmother.uz
      http:
        paths:
          - path: /sse
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8000
    - host: api.botspace.uz
      http:
        paths:
          - path: /sse
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8000
---
