apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: botmother-api
  namespace: botmother
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "1024m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: botlarnionasi.jscorp.uz
      http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 8080
          - path: /api/bot-webhook
            pathType: Prefix
            backend:
              service:
                name: webhook
                port:
                  number: 8080
          - path: /api/webhook-metrics
            pathType: Prefix
            backend:
              service:
                name: webhook
                port:
                  number: 8080
          - path: /api/bot-router
            pathType: Prefix
            backend:
              service:
                name: webhook
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8000
    - host: api.botmother.uz
      http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 8080
          - path: /api/bot-webhook
