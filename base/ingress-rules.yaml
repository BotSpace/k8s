# Dashboard (new) — served at root of botspace.uz, botmother.uz, beta.botmother.uz.
# Constructor is served on the same origin under /constructor so the cookie is
# shared (no third-party-cookie issues, no cross-origin iframe restrictions).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: botmother-frontend
  namespace: botmother
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: botspace.uz
      http:
        paths:
          - path: /constructor
            pathType: Prefix
            backend:
              service:
                name: constructor
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 3010
    - host: botmother.uz
      http:
        paths:
          - path: /constructor
            pathType: Prefix
            backend:
              service:
                name: constructor
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 3010
    - host: beta.botmother.uz
      http:
        paths:
          - path: /constructor
            pathType: Prefix
            backend:
              service:
                name: constructor
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 3010
---
# LangGraph LLM orchestrator (`agent` service in cluster).
# The rewrite strips the `/api/agent` prefix so FastAPI sees plain
# `/projects/...`. SSE-friendly: buffering off, long read/send timeouts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: botmother-agent
  namespace: botmother
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/connection-proxy-header: ""
spec:
  ingressClassName: nginx
  rules:
    - host: api.botmother.uz
      http:
        paths:
          - path: /api/agent(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: agent
                port:
                  number: 8100
    - host: api.botspace.uz
      http:
        paths:
          - path: /api/agent(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: agent
                port:
                  number: 8100
---
