apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: botmother-redirect
  namespace: botmother
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/permanent-redirect: "http://botspace.uz$request_uri"
spec:
  ingressClassName: nginx
  rules:
    - host: botmother.uz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 3000
