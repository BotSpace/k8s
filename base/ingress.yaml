apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: botmother
  namespace: botmother
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: botmother.uz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 3000

    - host: api.botmother.uz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: botmother-web
                port:
                  number: 8000
