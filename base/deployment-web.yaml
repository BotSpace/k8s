apiVersion: apps/v1
kind: Deployment
metadata:
  name: botmother-web
  namespace: botmother
  labels:
    app: botmother
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: botmother
      component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: botmother
        component: web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #             - key: name
      #               operator: In
      #               values:
      #                 - base
      serviceAccountName: backend-sa
      # Default ndots:5 makes psycopg/glibc resolve `cluster-rw.default.svc.cluster.local`
      # by trying every search domain first, racing AAAA+A queries; under
      # CoreDNS load this returns EAI_AGAIN at startup. Force direct lookup
      # and single-request to avoid the race.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          - name: single-request-reopen
          - name: timeout
            value: "2"
          - name: attempts
            value: "3"
      # nodeSelector:
      #   name: base
      containers:
        - name: web
          image: registry.iprogrammer.uz/botspace/botmother:2.4.9-prod # {"$imagepolicy": "flux-system:backend"}
          imagePullPolicy: Always
          # Pre-resolve the DB host before handing off to the entrypoint —
          # single-replica CoreDNS sometimes returns EAI_AGAIN to glibc on
          # the very first getaddrinfo during a rollout, and the entrypoint
          # has `set -e` with no retry of its own.
          command:
            - sh
            - -c
            - |
              # CI bakes `.env.example` into the image as `.env` (see
              # `cp .env.example .env` in deploy.yml), and django-environ's
              # `read_env(".env")` overrides our configmap with dev defaults
              # like `DJANGO_SETTINGS_MODULE=config.settings.local`,
              # `DEBUG=True`, `ALLOWED_HOSTS=127.0.0.1,web`. Strip it.
              rm -f /code/.env
              for i in $(seq 1 15); do
                if getent hosts cluster-rw.default.svc.cluster.local >/dev/null 2>&1; then
                  echo "DNS ready after $i attempt(s)"
                  break
                fi
                echo "[entrypoint] waiting for DNS ($i/15)..."
                sleep 2
              done
              exec sh ./resources/scripts/entrypoint-server.sh
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: PYTHONPYCACHEPREFIX
              value: "/var/cache/pycache"
            # `botmother-secret` (envFrom below) ships stale ALLOWED_HOSTS /
            # CSRF_TRUSTED_ORIGINS values that omit localhost and the
            # botspace.uz domains. Explicit env entries outrank envFrom, so
            # wire the full list here until the secret is rotated.
            - name: ALLOWED_HOSTS
              value: "localhost,api.botmother.uz,botmother.uz,beta.botmother.uz,api.botspace.uz,botspace.uz,plugins.botmother.uz,plugins.botspace.uz,botlarnionasi.jscorp.uz"
            - name: CORS_ALLOWED_ORIGINS
              value: "https://botspace.uz,https://botmother.uz,https://beta.botmother.uz,https://botlarnionasi.jscorp.uz,https://api.botspace.uz,https://api.botmother.uz"
            - name: CSRF_TRUSTED_ORIGINS
              value: "https://botspace.uz,https://botmother.uz,https://beta.botmother.uz,https://botlarnionasi.jscorp.uz,https://api.botspace.uz,https://api.botmother.uz"
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          envFrom:
            - configMapRef:
                name: k8s
            - configMapRef:
                name: botmother-config
            - secretRef:
                name: botmother-secret
            - secretRef:
                name: database-secret
            - secretRef:
                name: mongo-secret
            - secretRef:
                name: redis-secret
            - secretRef:
                name: django-secret
            - secretRef:
                name: click-secret
            - secretRef:
                name: bot-secret
            - secretRef:
                name: jwt-secret
          resources:
            requests:
              cpu: 1000m
              memory: 1Gi
            limits:
              cpu: 4000m
              memory: 4Gi
          volumeMounts:
            - name: media
              mountPath: /code/resources/media
            - name: static
              mountPath: /code/resources/staticfiles
            - name: logs
              mountPath: /code/resources/logs
            - name: engine-dir
              mountPath: /mnt/engine
              readOnly: false
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
              scheme: HTTP
              # kubelet probes use the pod IP — rewrite Host so Django's
              # ALLOWED_HOSTS check accepts the request.
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
              scheme: HTTP
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /health/
              port: 8000
              scheme: HTTP
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1
      imagePullSecrets:
        - name: iprogrammer-registry
      volumes:
        - name: engine-dir
          hostPath:
            path: /mnt/engine
            type: DirectoryOrCreate
        - name: media
          persistentVolumeClaim:
            claimName: botmother-media
        - name: static
          persistentVolumeClaim:
            claimName: botmother-static
        - name: logs
          persistentVolumeClaim:
            claimName: botmother-logs
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: botmother
  labels:
    app: botmother
    component: web
spec:
  type: NodePort
  selector:
    app: botmother
    component: web
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
      nodePort: 30002
