apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: redis-daemon
  labels:
    app: redis
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - name: redis
              containerPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-redis
  labels:
    app: main-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: main-redis
  template:
    metadata:
      labels:
        app: main-redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - name: redis
              containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: botmother
  labels:
    app: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  internalTrafficPolicy: Local
---
apiVersion: v1
kind: Service
metadata:
  name: main-redis
  namespace: botmother
  labels:
    app: main-redis
spec:
  type: ClusterIP
  selector:
    app: main-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
