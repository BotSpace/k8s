apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: redis-daemon
  labels:
    app: redis
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7
          env:
            - name: REDIS_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - name: redis
              containerPort: 6379
              hostPort: 6379
