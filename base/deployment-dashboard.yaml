apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: botmother
  labels:
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: dashboard
        component: frontend
      annotations:
        prometheus.io/scrape: "false"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: name
                    operator: NotIn
                    values:
                      - base
      containers:
        - name: dashboard
          image: registry.irpgrammer.uz/botspace/dashboard:1.0.0-prod # {"$imagepolicy": "flux-system:dashboard"}
          imagePullPolicy: Always
          ports:
            - containerPort: 3010
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: dashboard-config
            - secretRef:
                name: dashboard-secret
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: 3010
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: 3010
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3010
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      imagePullSecrets:
        - name: irpgrammer-registry
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: botmother
  labels:
    app: dashboard
spec:
  type: NodePort
  selector:
    app: dashboard
  ports:
    - name: http
      port: 3010
      targetPort: 3010
      protocol: TCP
      nodePort: 30010
