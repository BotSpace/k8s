apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: botmother
  labels:
    app: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: admin
        component: frontend
      annotations:
        prometheus.io/scrape: "false"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: name
                    operator: NotIn
                    values:
                      - base
      containers:
        - name: admin
          image: registry.jscorp.uz/botmother-admin:2.1.1-prod # {"$imagepolicy": "flux-system:admin"}
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: admin-config
          resources:
            requests:
              cpu: 1000m
              memory: 1Gi
            limits:
              cpu: 3000m
              memory: 3Gi
      imagePullSecrets:
        - name: botmother-registry
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: botmother
  labels:
    app: admin
spec:
  type: NodePort
  selector:
    app: admin
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
      nodePort: 30001
