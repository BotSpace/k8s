apiVersion: v1
kind: ConfigMap
metadata:
  name: botmother-config
  namespace: botmother
data:
  # Django configs
  DEBUG: "False"
  DJANGO_SETTINGS_MODULE: "config.settings.production"
  PROJECT_ENV: "prod"
  PROTOCOL_HTTPS: "True"
  SILK_ENABLED: "False"
  # `localhost` is required because the kubelet probes hit the pod IP and we
  # rewrite the Host header to `localhost` (see deployment-web.yaml).
  ALLOWED_HOSTS: "localhost,api.botmother.uz,botmother.uz,beta.botmother.uz,api.botspace.uz,botspace.uz,plugins.botmother.uz,plugins.botspace.uz,botlarnionasi.jscorp.uz"

  # OTP configs
  OTP_SIZE: "4"
  OTP_PROD: "true"
  OTP_MODULE: "core.services.otp"
  OTP_SERVICE: "EskizService"

  DB_ENGINE: "django.db.backends.postgresql_psycopg2"

  # Cache configs (connection details for external Redis)
  CACHE_BACKEND: "django.core.cache.backends.redis.RedisCache"
  REDIS_PORT: "6379"
  CACHE_ENABLED: "true"
  CACHE_TIMEOUT: "120"

  # Vite settings
  VITE_LIVE: "false"
  VITE_PORT: "5173"
  VITE_HOST: "127.0.0.1"

  # Storage
  STORAGE_DEFAULT: "FILE"
  STORAGE_STATIC: "STATIC"

  # Pricing
  RAM_PRICE: "1000"
  CPU_PRICE: "1000"
  NET_RX_PRICE: "1000"
  NET_TX_PRICE: "1000"
  STORAGE_PRICE: "1000"

  # Prometheus
  PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus_metrics"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: market-config
  namespace: botmother
data:
  DEBUG: "true"
  NEXT_PUBLIC_API: "https://api.botmother.uz"
  CONSTRUCTOR_URL: "https://constructor.botmother.uz"
  SALES_URL: "http://example.com"
  ADMIN_PANEL: "http://example.com"
  NEXTAUTH_SECRET: "REMOVED_CREDENTIAL"
  TELEGRAM_BOT_TOKEN: "REMOVED_CREDENTIAL"
  TELEGRAM_CHAT_ID: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-config
  namespace: botmother
data:
  DEBUG: "true"
  NEXT_PUBLIC_API: "https://api.botmother.uz"
  CONSTRUCTOR_URL: "http://constructor:30005"
  SALES_URL: "http://market:30003"
  NEXTAUTH_SECRET: "REMOVED_CREDENTIAL"
  NEXTAUTH_URL: "https://botspace.uz"
  PORT: "3000"
  NODE_ENV: "production"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: constructor-config
  namespace: botmother
data:
  DEBUG: "false"
  NEXT_PUBLIC_API: "https://api.botmother.uz"
  CONSTRUCTOR_URL: "https://botspace.uz/constructor"
  # ADMIN_PANEL kept for legacy references; new code reads DASHBOARD_URL.
  ADMIN_PANEL: "https://botspace.uz"
  DASHBOARD_URL: "https://botspace.uz"
  NEXT_PUBLIC_AGENT_API: "https://api.botspace.uz/api/agentv2"
  # Shared session — must match dashboard's SESSION_SECRET (provided via secret).
  SESSION_COOKIE_NAME: "bm_session"
  # MONO=0 → run under /constructor basePath. The ingress strips/proxies the
  # /constructor prefix and Next.js serves under it.
  MONO: "0"
  PORT: "3000"
  NODE_ENV: "production"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-config
  namespace: botmother
data:
  NODE_ENV: "production"
  PORT: "3010"
  # Backend & external services
  NEXT_PUBLIC_API_URL: "https://api.botmother.uz"
  NEXT_PUBLIC_AGENT_URL: "https://api.botmother.uz/api/agent"
  # Constructor iframe target — same origin as the dashboard, served at
  # /constructor by the same ingress.
  NEXT_PUBLIC_CONSTRUCTOR_URL: "https://botspace.uz/constructor"
  NEXT_PUBLIC_SITE_URL: "https://botspace.uz"
  NEXT_PUBLIC_TELEGRAM_BOT: "botmother_authbot"
  NEXT_PUBLIC_DEFAULT_LOCALE: "uz"
  # Shared session — same cookie name across dashboard + constructor.
  SESSION_COOKIE_NAME: "bm_session"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: botmother
data:
  AGENT_HOST: "0.0.0.0"
  AGENT_PORT: "8100"
  AGENT_LOG_LEVEL: "INFO"
  AGENT_CORS_ORIGINS: "https://botspace.uz,https://botmother.uz,https://beta.botmother.uz"

  # LLM routing — Bedrock via cross-region inference profiles.
  AGENT_LLM_PROVIDER: "bedrock"
  AGENT_MODEL_PLANNER: "claude-opus-4-7"
  AGENT_MODEL_EXECUTOR: "claude-sonnet-4-6"
  AGENT_MODEL_CRITIC: "claude-haiku-4-5"
  AGENT_MODEL_EMBEDDING: "text-embedding-3-small"
  AWS_REGION: "us-east-1"

  # Budgets
  AGENT_MAX_INPUT_TOKENS: "200000"
  AGENT_MAX_OUTPUT_TOKENS: "16000"
  AGENT_MAX_TOOL_CALLS: "80"
  AGENT_MAX_WALL_SECONDS: "900"

  # Internal services (cluster-internal DNS)
  BACKEND_BASE_URL: "http://web:8000"
  MONGO_BASE_URL: "mongodb://mongodb:27017"
  MONGO_DB_PREFIX: "project_"
  ENGINE_BASE_URL: "http://engine-plugin:8090"

  # RAG (disabled by default)
  AGENT_RAG_ENABLED: "false"
  AGENT_RAG_TOP_K: "6"

  JWT_ALGORITHM: "HS256"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-config
  namespace: botmother
data:
  PORT: "8080"
  REDIS_ADDR: "redis:6379"
  API_URL: "https://api.botmother.uz"
  CACHE_TTL_SECONDS: "300"
  BOT_TOKEN: ""
