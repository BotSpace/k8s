apiVersion: apps/v1
kind: Deployment
metadata:
  name: constructor
  namespace: botmother
  labels:
    app: constructor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: constructor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: constructor
        component: frontend
      annotations:
        prometheus.io/scrape: "false"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: name
                    operator: NotIn
                    values:
                      - base
      containers:
        - name: constructor
          image: registry.jscorp.uz/botmother-constructor:3.0.4-prod # {"$imagepolicy": "flux-system:constructor"}
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: constructor-config
          resources:
            requests:
              cpu: 1000m
              memory: 1Gi
            limits:
              cpu: 3000m
              memory: 3Gi
          startupProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      imagePullSecrets:
        - name: botmother-registry
---
apiVersion: v1
kind: Service
metadata:
  name: constructor
  namespace: botmother
  labels:
    app: constructor
spec:
  type: NodePort
  selector:
    app: constructor
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
      nodePort: 30005
