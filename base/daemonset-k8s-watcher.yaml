apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: botmother-k8s-watcher
  namespace: botmother
  labels:
    app: botmother
    component: k8s-watcher
spec:
  selector:
    matchLabels:
      app: botmother
      component: k8s-watcher
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: botmother
        component: k8s-watcher
    spec:
      serviceAccountName: backend-sa
      restartPolicy: Always
      containers:
        - name: k8s-watcher
          image: registry.jscorp.uz/botmother:2.3.0-prod # {"$imagepolicy": "flux-system:backend"}
          imagePullPolicy: Always
          command:
            - python
            - manage.py
            - watch_k8s_events
            - --verbose
          envFrom:
            - configMapRef:
                name: k8s
            - configMapRef:
                name: botmother-config
            - secretRef:
                name: botmother-secret
            - secretRef:
                name: database-secret
            - secretRef:
                name: mongo-secret
            - secretRef:
                name: redis-secret
            - secretRef:
                name: django-secret
            - secretRef:
                name: click-secret
            - secretRef:
                name: bot-secret
            - secretRef:
                name: jwt-secret
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: engine-dir
              mountPath: /mnt/engine
              readOnly: false
            - name: logs
              mountPath: /code/resources/logs
      imagePullSecrets:
        - name: botmother-registry
      volumes:
        - name: engine-dir
          hostPath:
            path: /mnt/engine
            type: DirectoryOrCreate
        - name: logs
          persistentVolumeClaim:
            claimName: botmother-logs
