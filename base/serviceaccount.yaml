apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: botmother
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-role
  namespace: botmother
rules:
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/exec
    verbs:
      - get
      - list
      - watch
      - delete
      - create

  - apiGroups: [""]
    resources:
      - services
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete

  - apiGroups: [""]
    resources:
      - configmaps
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete

  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete

  - apiGroups: [""]
    resources:
      - events
    verbs:
      - get
      - list
      - watch

  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-binding
  namespace: botmother
subjects:
  - kind: ServiceAccount
    name: backend-sa
roleRef:
  kind: Role
  name: backend-role
  apiGroup: rbac.authorization.k8s.io
