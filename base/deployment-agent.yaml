apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: botmother
  labels:
    app: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: agent
        component: backend
      annotations:
        prometheus.io/scrape: "false"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: name
                    operator: NotIn
                    values:
                      - base
      containers:
        - name: agent
          image: registry.iprogrammer.uz/botspace/agent:1.0.1-prod # {"$imagepolicy": "flux-system:agent"}
          imagePullPolicy: Always
          ports:
            - containerPort: 8100
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: agent-config
            # Runtime secrets owned by this deployment (SESSION_SECRET, DB URL,
            # AGENT_INTERNAL_API_TOKEN). Kept distinct from the legacy
            # `agent-secret` so we don't blow that away on changes.
            - secretRef:
                name: agent-runtime-secret
            # Legacy `agent-secret` provides AWS_* for Bedrock (created back
            # when agentv1/agentv2 were running). envFrom merge order means
            # values from agent-runtime-secret take precedence on conflict.
            - secretRef:
                name: agent-secret
                optional: true
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      imagePullSecrets:
        - name: iprogrammer-registry
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: botmother
  labels:
    app: agent
spec:
  type: ClusterIP
  selector:
    app: agent
  ports:
    - name: http
      port: 8100
      targetPort: 8100
      protocol: TCP
