apiVersion: apps/v1
kind: Deployment
metadata:
  name: botmother-agent
  namespace: botmother
  labels:
    app: botmother
    component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: botmother
      component: agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: botmother
        component: agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: name
                    operator: In
                    values:
                      - base
      terminationGracePeriodSeconds: 30
      containers:
        - name: agent
          image: registry.jscorp.uz/botmother-agent:1.1.5-prod # {"$imagepolicy": "flux-system:botmother-agent"}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: PUBLIC_KEY
          envFrom:
            - configMapRef:
                name: agent-config
            - secretRef:
                name: agent-secret
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
      imagePullSecrets:
        - name: botmother-registry
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: botmother
  labels:
    app: botmother
    component: agent
spec:
  type: ClusterIP
  selector:
    app: botmother
    component: agent
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: botmother
data:
  BOTMOTHER_MODEL: "gpt-4o"
