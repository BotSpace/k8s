apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: botmother
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: auth
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: auth
          image: registry.jscorp.uz/auth:1.0.13-prod # {"$imagepolicy": "flux-system:auth"}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google
                  key: GOOGLE_CLIENT_ID
            - name: GIN_MODE
              value: release
            - name: ADDR
              value: ":8080"
            - name: DATABASE_TYPE
              value: postgres
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: DB_DSN
            - name: PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: PRIVATE_KEY
            - name: PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: PUBLIC_KEY
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
      imagePullSecrets:
        - name: botmother-registry
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: botmother
  labels:
    app: auth
spec:
  type: ClusterIP
  selector:
    app: auth
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
