apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: botmother

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - daemonset-redis.yaml
  - configmap-botmother.yaml
  - secret.yaml
  - pvc.yaml
  - service.yaml
  - deployment-web.yaml
  - deployment-k8s-watcher.yaml
  - deployment-celery-worker.yaml
  - deployment-celery-beat.yaml
  - deployment-webhook.yaml
  - deployment-market.yaml
  - deployment-admin.yaml
  - deployment-constructor.yaml
  - pdb.yaml
  - ingress.yaml
  - configmap-nginx.yaml
  - daemonset-nginx.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: botmother
