apiVersion: apps/v1
kind: Deployment
metadata:
  name: botmother-celery-beat
  namespace: botmother
  labels:
    app: botmother
    component: celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: botmother
      component: celery-beat
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: botmother
        component: celery-beat
      annotations:
        prometheus.io/scrape: "false"
    spec:
      containers:
        - name: celery-beat
          image: registry.jscorp.uz/botmother:2.2.10-prod # {"$imagepolicy": "flux-system:backend"}
          imagePullPolicy: Always
          command: ["sh", "./resources/scripts/celery-beat.sh"]
          envFrom:
            - configMapRef:
                name: botmother-config
            - secretRef:
                name: botmother-secret
            - secretRef:
                name: database-secret
            - secretRef:
                name: mongo-secret
            - secretRef:
                name: redis-secret
            - secretRef:
                name: django-secret
            - secretRef:
                name: click-secret
            - secretRef:
                name: bot-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 2000m
              memory: 1024Mi
      imagePullSecrets:
        - name: botmother-registry
