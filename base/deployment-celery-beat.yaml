apiVersion: apps/v1
kind: Deployment
metadata:
  name: botmother-celery-beat
  namespace: botmother
  labels:
    app: botmother
    component: celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: botmother
      component: celery-beat
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: botmother
        component: celery-beat
      annotations:
        prometheus.io/scrape: "false"
    spec:
      containers:
        - name: celery-beat
          image: registry.jscorp.uz/botmother:2.3.0-prod # {"$imagepolicy": "flux-system:backend"}
          imagePullPolicy: Always
          command: ["sh", "./resources/scripts/celery-beat.sh"]
          envFrom:
            - configMapRef:
                name: botmother-config
            - secretRef:
                name: botmother-secret
            - secretRef:
                name: database-secret
            - secretRef:
                name: mongo-secret
            - secretRef:
                name: redis-secret
            - secretRef:
                name: django-secret
            - secretRef:
                name: click-secret
            - secretRef:
                name: bot-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 2000m
              memory: 1024Mi
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f "celery"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f "celery"
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f "celery"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      imagePullSecrets:
        - name: botmother-registry
