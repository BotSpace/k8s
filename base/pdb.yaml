apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: botmother-web-pdb
  namespace: botmother
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: botmother
      component: web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: webhook-pdb
  namespace: botmother
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: webhook
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: botmother-nginx-pdb
  namespace: botmother
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: botmother
      component: nginx
