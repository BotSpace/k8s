apiVersion: v1
kind: Service
metadata:
  name: postgres-agentv3
  namespace: botmother
  labels:
    app: postgres-agentv3
spec:
  clusterIP: None
  selector:
    app: postgres-agentv3
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-agentv3
  namespace: botmother
  labels:
    app: postgres-agentv3
spec:
  serviceName: postgres-agentv3
  replicas: 1
  selector:
    matchLabels:
      app: postgres-agentv3
  template:
    metadata:
      labels:
        app: postgres-agentv3
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: name
                    operator: NotIn
                    values:
                      - base
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: agentv3
            - name: POSTGRES_USER
              value: agentv3
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentv3-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "agentv3", "-d", "agentv3"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "agentv3", "-d", "agentv3"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
