apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-plugin-ui
  namespace: botmother
  labels:
    app: engine-plugin-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engine-plugin-ui
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: engine-plugin-ui
        component: frontend
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: engine-plugin-ui
          image: registry.jscorp.uz/engine-plugin-ui:1.4.3-prod # {"$imagepolicy": "flux-system:engine-plugin-ui"}
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: NEXTAUTH_SECRET
              value: "botmother-plugin-ui-secret-2026"
            - name: NEXTAUTH_URL
              value: "https://plugins.botmother.uz"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google
                  key: GOOGLE_CLIENT_SECRET
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: github
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: github
                  key: GITHUB_CLIENT_SECRET
            - name: ALLOWED_EMAILS
              value: "jscorptech@gmail.com"
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.botmother.uz/api/engine-plugin"
            - name: BACKEND_API_URL
              value: "http://engine-plugin:8090/api"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: engine-plugin-secret
                  key: API_KEY
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
      imagePullSecrets:
        - name: botmother-registry
---
apiVersion: v1
kind: Service
metadata:
  name: engine-plugin-ui
  namespace: botmother
  labels:
    app: engine-plugin-ui
spec:
  type: ClusterIP
  selector:
    app: engine-plugin-ui
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
