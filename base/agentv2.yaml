apiVersion: v1
kind: ConfigMap
metadata:
  name: agentv2-config
  namespace: botmother
  labels:
    app.kubernetes.io/name: agentv2
    app.kubernetes.io/part-of: botmother
data:
  AGENT_CORS_ORIGINS: "https://botspace.uz,https://botmother.uz"
  AGENT_DATABASE_URL: "sqlite:////app/data/agent_runs.db"
  AGENT_MODEL: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
  AGENT_REDIS_URL: "redis://agentv2-redis:6379/0"
  IS_OLLAMA: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentv2-flow-seed
  namespace: botmother
  labels:
    app.kubernetes.io/name: agentv2
    app.kubernetes.io/part-of: botmother
data:
  flow.json: |
    {
      "nodes": [],
      "edges": []
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentv2-data
  namespace: botmother
  labels:
    app.kubernetes.io/name: agentv2
    app.kubernetes.io/part-of: botmother
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agentv2-redis
  namespace: botmother
  labels:
    app.kubernetes.io/name: agentv2-redis
    app.kubernetes.io/part-of: botmother
spec:
  selector:
    app.kubernetes.io/name: agentv2-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: Service
metadata:
  name: agentv2
  namespace: botmother
  labels:
    app.kubernetes.io/name: agentv2
    app.kubernetes.io/part-of: botmother
spec:
  selector:
    app.kubernetes.io/name: agentv2
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentv2
  namespace: botmother
  labels:
    app.kubernetes.io/name: agentv2
    app.kubernetes.io/part-of: botmother
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentv2
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentv2
        app.kubernetes.io/part-of: botmother
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
        - name: agentv2-harbor-registry
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: seed-flow
          image: busybox:1.36
          command:
            - sh
            - -c
            - cp -n /seed/flow.json /app/data/flow.json && chown 10001:10001 /app/data/flow.json && chmod 664 /app/data/flow.json
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: flow-seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: api
          image: registry.iprogrammer.uz/agentv2/botmother-agent:prod-7905e71
          imagePullPolicy: IfNotPresent
          command:
            - bm-agent
          args:
            - api
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --flow
            - data/flow.json
            - --model
            - $(AGENT_MODEL)
            - --database-url
            - $(AGENT_DATABASE_URL)
            - --redis-url
            - $(AGENT_REDIS_URL)
            - --cors-origins
            - $(AGENT_CORS_ORIGINS)
          envFrom:
            - configMapRef:
                name: agentv2-config
            - secretRef:
                name: agentv2-secret
                optional: true
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agentv2-data
        - name: flow-seed
          configMap:
            name: agentv2-flow-seed
            items:
              - key: flow.json
                path: flow.json
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agentv2-redis
  namespace: botmother
  labels:
    app.kubernetes.io/name: agentv2-redis
    app.kubernetes.io/part-of: botmother
spec:
  replicas: 1
  serviceName: agentv2-redis
  selector:
    matchLabels:
      app.kubernetes.io/name: agentv2-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentv2-redis
        app.kubernetes.io/part-of: botmother
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --appendonly
            - "yes"
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentv2
  namespace: botmother
  labels:
    app.kubernetes.io/name: agentv2
    app.kubernetes.io/part-of: botmother
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: botlarnionasi.jscorp.uz
      http:
        paths:
          - path: /api/agentv2(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: agentv2
                port:
                  name: http
    - host: api.botmother.uz
      http:
        paths:
          - path: /api/agentv2(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: agentv2
                port:
                  name: http
    - host: api.botspace.uz
      http:
        paths:
          - path: /api/agentv2(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: agentv2
                port:
                  name: http
