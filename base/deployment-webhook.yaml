apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook
  namespace: botmother
  labels:
    app: webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: webhook
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: webhook
          image: registry.jscorp.uz/webhook:2.0.6-prod # {"$imagepolicy": "flux-system:webhook"}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: webhook-config
            - secretRef:
                name: webhook-secret
          # env:
          #   - name: NODE_IP
          #     valueFrom:
          #       fieldRef:
          #         fieldPath: status.hostIP
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
      imagePullSecrets:
        - name: botmother-registry
---
apiVersion: v1
kind: Service
metadata:
  name: webhook
  namespace: botmother
  labels:
    app: webhook
spec:
  type: NodePort
  selector:
    app: webhook
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
      nodePort: 30004
