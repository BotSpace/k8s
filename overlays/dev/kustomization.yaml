apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: botmother-dev

resources:
  - ../../base

labels:
  - pairs:
      environment: development
      app.kubernetes.io/env: dev

patches:
  - target:
      kind: Service
      name: botmother-nginx
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30084
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

images:
  - name: registry.jscorp.uz/botmother
    newTag: "1.0.0-dev"
  - name: registry.jscorp.uz/botmother-sales
    newTag: latest
  - name: jscorptech/botmother-admin
    newTag: latest
  - name: jscorptech/botmother-constructor
    newTag: latest
  - name: registry.jscorp.uz/botmother-webhook-service
    newTag: latest
  - name: nginx
    newTag: 1.27-alpine

configMapGenerator:
  - name: env-config
    literals:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
