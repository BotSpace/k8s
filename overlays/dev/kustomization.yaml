apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: botmother-dev

resources:
  - ../../base

labels:
  - pairs:
      environment: development
      app.kubernetes.io/env: dev

images:
  - name: registry.jscorp.uz/botmother
    newTag: "2.0.9-dev" # {"$imagepolicy": "flux-system:backend-dev"}
  - name: registry.jscorp.uz/webhook
    newTag: "1.0.1-dev" # {"$imagepolicy": "flux-system:webhook-dev"}
  - name: registry.jscorp.uz/botmother-constructor
    newTag: "1.0.0-dev" # {"$imagepolicy": "flux-system:constructor-dev"}
  - name: registry.jscorp.uz/botmother-market
    newTag: "1.0.0-dev" # {"$imagepolicy": "flux-system:market-dev"}
  - name: registry.jscorp.uz/botmother-admin
    newTag: "1.0.0-dev" # {"$imagepolicy": "flux-system:admin-dev"}

configMapGenerator:
  - name: k8s
    literals:
      - K8S_NAMESPACE=botmother-dev

patches:
  - target:
      kind: Deployment
      name: botmother-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: remove
        path: /spec/template/spec/nodeSelector
  - target:
      kind: Deployment
      name: market
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: constructor
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: admin
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Service
      name: web
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 31002
  - target:
      kind: Service
      name: market
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 31003
  - target:
      kind: Service
      name: admin
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 31004
  - target:
      kind: Service
      name: constructor
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 31005
  - target:
      kind: Service
      name: webhook
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 31006
