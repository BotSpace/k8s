apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: botmother-dev
resources:
  - ../../base
labels:
  - pairs:
      environment: development
      app.kubernetes.io/env: dev
images:
  - name: registry.jscorp.uz/botmother
    newTag: "2.3.3-dev" # {"$imagepolicy": "flux-system:backend-dev:tag"}
  - name: registry.jscorp.uz/webhook
    newTag: "1.0.1-dev" # {"$imagepolicy": "flux-system:webhook-dev:tag"}
  - name: registry.jscorp.uz/botmother-agent
    newTag: "2.0.2-dev" # {"$imagepolicy": "flux-system:botmother-agent-dev:tag"}
  - name: registry.jscorp.uz/engine-plugin
    newTag: "1.5.1-dev" # {"$imagepolicy": "flux-system:engine-plugin-dev:tag"}
  - name: registry.jscorp.uz/engine-plugin-ui
    newTag: "1.4.3-dev" # {"$imagepolicy": "flux-system:engine-plugin-ui-dev:tag"}
  - name: registry.jscorp.uz/botmother-admin
    newTag: "2.1.9-dev" # {"$imagepolicy": "flux-system:admin-dev:tag"}
  - name: registry.jscorp.uz/auth
    newTag: "1.0.19-dev" # {"$imagepolicy": "flux-system:auth-dev:tag"}
  - name: registry.jscorp.uz/botmother-market
    newTag: "2.0.5-dev" # {"$imagepolicy": "flux-system:market-dev:tag"}
  - name: registry.jscorp.uz/botmother-constructor
    newTag: "3.4.4-dev" # {"$imagepolicy": "flux-system:constructor-dev:tag"}
  - name: registry.jscorp.uz/websocket
    newTag: "1.0.11-dev" # {"$imagepolicy": "flux-system:websocket-dev:tag"}
configMapGenerator:
  - name: k8s
    literals:
      - K8S_NAMESPACE=botmother-dev
  - name: agent-config
    behavior: merge
    literals:
      - CORS_ORIGINS=https://dev.botspace.uz,https://dev.botmother.uz
patches:
  - target:
      kind: Deployment
      name: botmother-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: market
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: constructor
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: admin
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Service
      name: web
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 31002
  - target:
      kind: Service
      name: market
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 31003
  - target:
      kind: Service
      name: admin
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 31004
  - target:
      kind: Service
      name: constructor
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 31005
  - target:
      kind: Service
      name: webhook
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 31006
  - target:
      kind: Ingress
      name: botmother-api
    patch: |-
      - op: replace
        path: /spec/rules
        value:
          - host: dev-api.botspace.uz
            http:
              paths:
                - path: /api/v1/auth
                  pathType: Prefix
                  backend:
                    service:
                      name: auth
                      port:
                        number: 8080
                - path: /api/bot-webhook
                  pathType: Prefix
                  backend:
                    service:
                      name: webhook
                      port:
                        number: 8080
                - path: /api/webhook-metrics
                  pathType: Prefix
                  backend:
                    service:
                      name: webhook
                      port:
                        number: 8080
                - path: /api/bot-router
                  pathType: Prefix
                  backend:
                    service:
                      name: webhook
                      port:
                        number: 8080
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: web
                      port:
                        number: 8000
  - target:
      kind: Ingress
      name: botmother-websocket
    patch: |-
      - op: replace
        path: /spec/rules
        value:
          - host: dev-api.botspace.uz
            http:
              paths:
                - path: /ws
                  pathType: Prefix
                  backend:
                    service:
                      name: websocket
                      port:
                        number: 8080
  - target:
      kind: Ingress
      name: botmother-sse
    patch: |-
      - op: replace
        path: /spec/rules
        value:
          - host: dev-api.botspace.uz
            http:
              paths:
                - path: /sse
                  pathType: Prefix
                  backend:
                    service:
                      name: web
                      port:
                        number: 8000
  - target:
      kind: Ingress
      name: botmother-frontend
    patch: |-
      - op: replace
        path: /spec/rules
        value:
          - host: dev.botspace.uz
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: admin
                      port:
                        number: 3000
  - target:
      kind: Ingress
      name: botmother-redirect
    patch: |-
      - op: replace
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1temporal-redirect
        value: "https://dev.botspace.uz"
      - op: replace
        path: /spec/rules
        value:
          - host: dev.botmother.uz
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: admin
                      port:
                        number: 3000
  - target:
      kind: Ingress
      name: botmother-agent
    patch: |-
      - op: replace
        path: /spec/rules
        value:
          - host: dev-api.botspace.uz
            http:
              paths:
                - path: /api/agent(/|$)(.*)
                  pathType: ImplementationSpecific
                  backend:
                    service:
                      name: agent
                      port:
                        number: 8000
  - target:
      kind: Ingress
      name: botmother-engine-plugin
    patch: |-
      - op: replace
        path: /spec/rules
        value:
          - host: dev-api.botspace.uz
            http:
              paths:
                - path: /api/engine-plugin(/|$)(.*)
                  pathType: ImplementationSpecific
                  backend:
                    service:
                      name: engine-plugin
                      port:
                        number: 8090
  - target:
      kind: Ingress
      name: botmother-engine-plugin-ui
    patch: |-
      - op: replace
        path: /spec/rules
        value:
          - host: dev-plugins.botspace.uz
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: engine-plugin-ui
                      port:
                        number: 3000
