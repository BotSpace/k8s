apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: botmother
resources:
  - ../../base
labels:
  - pairs:
      environment: production
      app.kubernetes.io/env: prod

configMapGenerator:
  - name: k8s
    literals:
      - K8S_NAMESPACE=botmother
  - name: env-config
    literals:
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO

patches:
  - target:
      kind: Deployment
      name: webhook
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
