# Umami — self-hosted web/product analytics (botspace.uz + botspace.uz/app).
# Mavjud host Postgres'dagi alohida `umami` DB'dan foydalanadi (botspace user,
# CREATEDB). Sirlar (DATABASE_URL, APP_SECRET) `umami` Secret'da — git'da EMAS,
# kubectl bilan alohida yaratilgan.
#
# Tashqi kirish: nginx → main-gateway (Gateway API) → HTTPRoute → umami Service
# (ClusterIP). NodePort YO'Q.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami
  namespace: botmother
  labels:
    app: umami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: umami
  template:
    metadata:
      labels:
        app: umami
    spec:
      containers:
        - name: umami
          image: ghcr.io/umami-software/umami:postgresql-latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_TYPE
              value: postgresql
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: umami
                  key: DATABASE_URL
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: umami
                  key: APP_SECRET
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/heartbeat
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: umami
  namespace: botmother
  labels:
    app: umami
spec:
  type: ClusterIP
  selector:
    app: umami
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: umami
  namespace: botmother
spec:
  hostnames:
    - umami.botspace.uz
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main-gateway
      namespace: default
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: umami
          port: 3000
          weight: 1
